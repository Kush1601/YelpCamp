name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://yelpcamp:yelpcamp@localhost:5432/yelpcamp
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Ensure loopback is never routed through a proxy resolver, which on some
      # runners surfaces as ERR_NAME_NOT_RESOLVED for 127.0.0.1 in Chromium.
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Start PostGIS + pgvector database
        run: docker compose up -d --build db

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U yelpcamp -d yelpcamp && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
