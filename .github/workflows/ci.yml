name: CI

on:
  push:
  pull_request:

jobs:
  # Lint + build verify the code compiles for the exact commit.
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://yelpcamp:yelpcamp@localhost:5432/yelpcamp
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # E2E runs against the live Vercel deployment. Testing the deployed app over
  # real HTTPS avoids Chromium's broken loopback network-service resolver on
  # ubuntu-latest runners (ERR_NAME_NOT_RESOLVED on 127.0.0.1), and needs no
  # local Postgres/build. The suite is read-only navigation, so hitting prod
  # is safe.
  e2e:
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BASE_URL: https://yelpcamp-topaz.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests against live deployment
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
